<svg viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de bolsa de compras con productos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bagGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CDB4F7"/>
      <stop offset="100%" stop-color="#8E7CC3"/>
    </linearGradient>
  </defs>

  <!-- Círculo de fondo -->
  <circle cx="240" cy="210" r="190" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="240" cy="210" r="150" fill="#FFFFFF" fill-opacity="0.10"/>

  <!-- Sombra de la bolsa -->
  <ellipse cx="240" cy="368" rx="110" ry="14" fill="#000000" fill-opacity="0.12"/>

  <!-- Asas de la bolsa -->
  <path d="M175 150 Q175 90 240 90 Q305 90 305 150" fill="none" stroke="#6F5CA8" stroke-width="14" stroke-linecap="round"/>

  <!-- Cuerpo de la bolsa -->
  <path d="M140 150 L340 150 L322 355 Q320 365 310 365 L170 365 Q160 365 158 355 Z" fill="url(#bagGradient)"/>

  <!-- Pliegue central de la bolsa -->
  <path d="M140 150 L340 150 L336 180 L144 180 Z" fill="#FFFFFF" fill-opacity="0.18"/>

  <!-- Corazón / logo simplificado en la bolsa -->
  <path d="M240 235 C225 215 195 220 195 248 C195 272 225 288 240 300 C255 288 285 272 285 248 C285 220 255 215 240 235 Z" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Producto 1: bolsa de pan -->
  <g transform="translate(60 195) rotate(-8)">
    <rect x="0" y="0" width="60" height="70" rx="10" fill="#FBBF24"/>
    <path d="M8 0 Q30 -18 52 0" fill="none" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
    <rect x="10" y="18" width="40" height="6" rx="3" fill="#B45309" fill-opacity="0.5"/>
    <rect x="10" y="32" width="40" height="6" rx="3" fill="#B45309" fill-opacity="0.5"/>
  </g>

  <!-- Producto 2: manzana -->
  <g transform="translate(360 180)">
    <circle cx="30" cy="35" r="30" fill="#F87171"/>
    <rect x="27" y="0" width="6" height="14" rx="3" fill="#6F5CA8"/>
    <path d="M33 6 Q48 2 50 16" fill="none" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Producto 3: vaso de bebida -->
  <g transform="translate(365 275)">
    <path d="M4 0 L46 0 L40 64 Q39 70 33 70 L17 70 Q11 70 10 64 Z" fill="#60A5FA"/>
    <rect x="0" y="-8" width="50" height="10" rx="4" fill="#3B82F6"/>
    <rect x="20" y="-24" width="6" height="20" rx="3" fill="#3B82F6"/>
  </g>

  <!-- Estrellas decorativas -->
  <g fill="#FBBF24">
    <path d="M100 90 l4 10 10 1 -7 7 2 10 -9 -5 -9 5 2 -10 -7 -7 10 -1z"/>
    <path d="M395 100 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z"/>
    <path d="M60 320 l3 7 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z"/>
  </g>
</svg>
